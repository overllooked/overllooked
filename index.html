  <script>
    /*
     * =========================================================
     * DOVIN REDIRECT CONFIG
     * =========================================================
     *
     * Put a destination URL here when one exists.
     *
     * If this is empty, null, undefined, or only whitespace,
     * the Worker fallback will automatically be used.
     */

    const CONFIGURED_DESTINATION = "";

    const FALLBACK_DESTINATION =
      "https://dovin.odd-wave-c130.workers.dev";


    /*
     * =========================================================
     * DESTINATION CHECK
     * =========================================================
     */

    const destination =
      typeof CONFIGURED_DESTINATION === "string" &&
      CONFIGURED_DESTINATION.trim() !== ""
        ? CONFIGURED_DESTINATION.trim()
        : FALLBACK_DESTINATION;


    /*
     * =========================================================
     * REDIRECT
     * =========================================================
     */

    const countdown = document.getElementById("countdown");
    const redirectLink = document.getElementById("redirect-link");
    const progressBar = document.getElementById("redirect-progress-bar");

    // Make the fallback link point to the actual destination.
    redirectLink.href = destination;

    let seconds = 3;

    const interval = setInterval(() => {
      seconds--;

      countdown.textContent = seconds;

      const progress = ((3 - seconds) / 3) * 100;
      progressBar.style.width = `${progress}%`;

      if (seconds <= 0) {
        clearInterval(interval);

        window.location.href = destination;
      }
    }, 1000);
  </script>
